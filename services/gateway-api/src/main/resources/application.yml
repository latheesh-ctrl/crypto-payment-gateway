spring:
  application:
    name: gateway-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gateway}
    username: ${DATABASE_USERNAME:gateway}
    password: ${DATABASE_PASSWORD:gateway}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
  flyway:
    locations: classpath:db/migration
  jackson:
    # Public API uses snake_case field names throughout.
    property-naming-strategy: SNAKE_CASE

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  mode: ${GATEWAY_MODE:test}
  security:
    # Server-side pepper mixed into API key hashes. Must be set from a secret store outside local dev.
    api-key-pepper: ${API_KEY_PEPPER:local-dev-pepper-change-me}
    # Temporary bootstrap credential for /internal endpoints until admin SSO lands. Empty disables them.
    admin-token: ${ADMIN_TOKEN:}
    # Base64 AES-256 key. The default is for local development only; production reads it from a secret store.
    data-encryption-key: ${DATA_ENCRYPTION_KEY:ZGV2LW9ubHktZGF0YS1lbmNyeXB0aW9uLWtleS0zMmI=}
  jobs:
    enabled: ${JOBS_ENABLED:true}
  checkout:
    # Origin of the hosted payment page; payment URLs point here and only this origin may call the checkout API.
    base-url: ${CHECKOUT_BASE_URL:http://localhost:3000}
  # Deposit address derivation: account-level extended PUBLIC keys only, from the custody provider or HSM.
  wallets:
    chains:
      TRON:
        xpub: ${WALLET_TRON_XPUB:}
      ETHEREUM:
        xpub: ${WALLET_ETHEREUM_XPUB:}
      BITCOIN:
        xpub: ${WALLET_BITCOIN_XPUB:}
        mainnet: ${WALLET_BITCOIN_MAINNET:false}
      BSC:
        xpub: ${WALLET_BSC_XPUB:}
      ARBITRUM:
        xpub: ${WALLET_ARBITRUM_XPUB:}
  # Chain watchers. Each chain scans one provider (rpc-url) and credits a deposit only after every provider in
  # verify-rpc-urls (comma-separated, each different from rpc-url) independently confirms it.
  indexer:
    chains:
      TRON:
        enabled: ${INDEXER_TRON_ENABLED:false}
        rpc-url: ${INDEXER_TRON_RPC_URL:}
        api-key: ${INDEXER_TRON_API_KEY:}
        verify-rpc-urls: ${INDEXER_TRON_VERIFY_RPC_URLS:}
        poll-interval: 3s
      ETHEREUM:
        enabled: ${INDEXER_ETHEREUM_ENABLED:false}
        rpc-url: ${INDEXER_ETHEREUM_RPC_URL:}
        verify-rpc-urls: ${INDEXER_ETHEREUM_VERIFY_RPC_URLS:}
        poll-interval: 12s
      BITCOIN:
        enabled: ${INDEXER_BITCOIN_ENABLED:false}
        rpc-url: ${INDEXER_BITCOIN_RPC_URL:}
        verify-rpc-urls: ${INDEXER_BITCOIN_VERIFY_RPC_URLS:}
        poll-interval: 60s
      BSC:
        enabled: ${INDEXER_BSC_ENABLED:false}
        rpc-url: ${INDEXER_BSC_RPC_URL:}
        verify-rpc-urls: ${INDEXER_BSC_VERIFY_RPC_URLS:}
        poll-interval: 3s
      ARBITRUM:
        enabled: ${INDEXER_ARBITRUM_ENABLED:false}
        rpc-url: ${INDEXER_ARBITRUM_RPC_URL:}
        verify-rpc-urls: ${INDEXER_ARBITRUM_VERIFY_RPC_URLS:}
        poll-interval: 2s
        max-blocks-per-poll: 200
  # Payout hot wallets per chain. Payouts are refused on chains not enabled here. The dev_key signer keeps a private
  # key in memory and exists for local development and test networks only: live mode refuses to start with it.
  payouts:
    stuck-after: ${PAYOUTS_STUCK_AFTER:30m}
    chains:
      ETHEREUM:
        enabled: ${PAYOUTS_ETHEREUM_ENABLED:false}
        rpc-url: ${PAYOUTS_ETHEREUM_RPC_URL:}
        dev-private-key: ${PAYOUTS_ETHEREUM_DEV_PRIVATE_KEY:}
        max-gas-price-wei: ${PAYOUTS_ETHEREUM_MAX_GAS_PRICE_WEI:200000000000}
      BSC:
        enabled: ${PAYOUTS_BSC_ENABLED:false}
        rpc-url: ${PAYOUTS_BSC_RPC_URL:}
        dev-private-key: ${PAYOUTS_BSC_DEV_PRIVATE_KEY:}
        max-gas-price-wei: ${PAYOUTS_BSC_MAX_GAS_PRICE_WEI:20000000000}
      ARBITRUM:
        enabled: ${PAYOUTS_ARBITRUM_ENABLED:false}
        rpc-url: ${PAYOUTS_ARBITRUM_RPC_URL:}
        dev-private-key: ${PAYOUTS_ARBITRUM_DEV_PRIVATE_KEY:}
        max-gas-price-wei: ${PAYOUTS_ARBITRUM_MAX_GAS_PRICE_WEI:10000000000}
        token-gas-limit: 1500000
